name: Formula Builder CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'formula_builder/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'formula_builder/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check formula_builder/formula_builder/ --ignore E501,E402,F401,F403,F405

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      mariadb:
        image: mariadb:10.6
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: admin
          MYSQL_DATABASE: test_frappe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install Frappe Bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets test-bench
          cd test-bench
          bench get-app formula_builder file://$GITHUB_WORKSPACE

      - name: Run Tests
        run: |
          cd test-bench
          bench new-site test-site --db-root-password admin --admin-password admin
          bench --site test-site install-app formula_builder
          bench --site test-site set-config allow_tests true
          bench --site test-site run-tests --app formula_builder
